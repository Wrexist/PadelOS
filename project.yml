# Generates PadelOS.xcodeproj. Regenerate after adding/removing files:
#   xcodegen generate
name: PadelOS
options:
  bundleIdPrefix: app.padelos
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    # Set your team in Xcode (Signing & Capabilities) or here to run on a device.
    DEVELOPMENT_TEAM: ""
    # The iPhone app's bundle ID. Every other identifier is derived from it: the watch app
    # (.watchkitapp), the extensions (.widgets) and the App Group (group.<this>).
    # Change it here (or in Xcode: project → Build Settings → PADEL_BUNDLE_ID) if the ID is
    # taken in your developer account.
    PADEL_BUNDLE_ID: app.padelos.PadelOS
    # Localization: strings are extracted from code into each target's String Catalog.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  PadelKit:
    path: Packages/PadelKit
targets:
  PadelOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
      - path: Apps/Shared
      - path: Apps/LiveActivityShared
    dependencies:
      - package: PadelKit
        product: PadelCore
      - package: PadelKit
        product: PadelSync
      - package: PadelKit
        product: PadelStore
      - target: PadelOSWatch
      - target: PadelOSWidgets
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: PadelOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PADEL_BUNDLE_ID)
            CFBundleURLSchemes:
              - padelos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PADEL_BUNDLE_ID)
        PRODUCT_NAME: PadelOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  PadelOSWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/Watch
      - path: Apps/Shared
      - path: Apps/WatchShared
    dependencies:
      - package: PadelKit
        product: PadelCore
      - package: PadelKit
        product: PadelSync
      - package: PadelKit
        product: PadelStore
      - target: PadelOSWatchWidgets
      - sdk: WidgetKit.framework
    entitlements:
      path: Apps/Watch/PadelOSWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(PADEL_BUNDLE_ID)
    info:
      path: Apps/Watch/Info.plist
      properties:
        CFBundleDisplayName: PadelOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(PADEL_BUNDLE_ID)
        PadelAppGroup: group.$(PADEL_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PADEL_BUNDLE_ID).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  PadelOSWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Apps/WatchWidget
      - path: Apps/WatchShared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Apps/WatchWidget/PadelOSWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(PADEL_BUNDLE_ID)
    info:
      path: Apps/WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: PadelOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PadelAppGroup: group.$(PADEL_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PADEL_BUNDLE_ID).watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  PadelOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/iOSWidget
      - path: Apps/LiveActivityShared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Apps/iOSWidget/Info.plist
      properties:
        CFBundleDisplayName: PadelOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PADEL_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION

  PadelOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/iOSUITests
    dependencies:
      - target: PadelOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PADEL_BUNDLE_ID).uitests
        TEST_TARGET_NAME: PadelOS
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PadelOS:
    build:
      targets:
        PadelOS: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PadelOSUITests
    run:
      config: Debug
  PadelOSWatch:
    build:
      targets:
        PadelOSWatch: all
    run:
      config: Debug
