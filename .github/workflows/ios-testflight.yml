name: iOS TestFlight

# Archive PadelOS (iPhone app + Live Activity widgets + Apple Watch app +
# complication) on a macOS runner and upload it to TestFlight.
#
#   preflight   ubuntu   version, secrets, release checks, App Store Connect, build number
#   package     ubuntu   PadelKit tests (Swift on Linux)
#   archive     macOS    pinned XcodeGen → unsigned archive → ad-hoc entitlements →
#                        signed export → inspect → upload
#   processing  ubuntu   wait for Apple to finish processing the build
#
# Same shape as Wrexist/Airline-Empire's release, for the same reasons: every
# question that does not need Xcode is answered before the macOS runner starts,
# and nobody waits for Apple on macOS (Airline-Empire measured 53 idle minutes).
#
# Run it from Actions → iOS TestFlight → Run workflow, or push a tag `ios-v1.0.1`.
# One-time setup (app record, API key, secrets): docs/RELEASE.md.
#
# Secrets — the same names and values as Airline-Empire:
#   APP_STORE_CONNECT_KEY_ID           API key id
#   APP_STORE_CONNECT_ISSUER_ID        issuer id (UUID)
#   APP_STORE_CONNECT_API_KEY_BASE64   the AuthKey_XXXX.p8, base64 or pasted as text
#   APPLE_TEAM_ID                      optional; project.yml's DEVELOPMENT_TEAM otherwise
# Optional manual signing (all three or none; otherwise Apple's cloud-managed
# certificate signs at export, which needs an Admin API key):
#   IOS_DISTRIBUTION_CERT_P12_BASE64   Apple Distribution certificate + private key (.p12)
#   IOS_DISTRIBUTION_CERT_PASSWORD     its export password
#   IOS_PROVISIONING_PROFILES_BASE64   base64 of a .zip holding the four App Store
#                                      profiles (app, widgets, watch app, watch widgets)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version, e.g. 1.0.1 (empty: MARKETING_VERSION from project.yml)'
        type: string
        default: ''
      upload:
        description: 'Upload to TestFlight (off: archive, export and validate only)'
        type: boolean
        default: true
  push:
    tags: ['ios-v*']

concurrency:
  # Never two archives at once (they would race for build numbers), and never
  # cancel one mid-upload.
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      upload: ${{ steps.version.outputs.upload }}
      team: ${{ steps.version.outputs.team }}
      build: ${{ steps.build.outputs.number }}
      signing: ${{ steps.secrets.outputs.signing }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Resolve version, team and upload
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_UPLOAD: ${{ inputs.upload }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            case "$GITHUB_REF" in
              refs/tags/ios-v*) VERSION="${GITHUB_REF_NAME#ios-v}" ;;
              *) VERSION="$(node scripts/release/lib/project.mjs version)" ;;
            esac
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Version must look like 1.0 or 1.0.1 (got '$VERSION')."
            exit 1
          fi
          UPLOAD=true
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_UPLOAD" != "true" ]; then UPLOAD=false; fi
          TEAM="$(node scripts/release/lib/project.mjs team)"
          {
            echo "version=$VERSION"
            echo "upload=$UPLOAD"
            echo "team=$TEAM"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::PadelOS $VERSION, team $TEAM, upload=$UPLOAD"

      - name: Require secrets
        id: secrets
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          CERT: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROFILES: ${{ secrets.IOS_PROVISIONING_PROFILES_BASE64 }}
        run: |
          missing=()
          [ -n "$KEY_ID" ] || missing+=(APP_STORE_CONNECT_KEY_ID)
          [ -n "$ISSUER_ID" ] || missing+=(APP_STORE_CONNECT_ISSUER_ID)
          [ -n "$API_KEY" ] || missing+=(APP_STORE_CONNECT_API_KEY_BASE64)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secret(s): ${missing[*]}. Settings → Secrets and variables → Actions; see docs/RELEASE.md §3."
            exit 1
          fi
          count=0
          for value in "$CERT" "$CERT_PASSWORD" "$PROFILES"; do [ -n "$value" ] && count=$((count + 1)); done
          case $count in
            0) echo "signing=automatic" >> "$GITHUB_OUTPUT"
               echo "::notice::Automatic signing: Apple's cloud-managed certificate signs at export (needs an Admin API key)." ;;
            3) echo "signing=manual" >> "$GITHUB_OUTPUT"
               echo "::notice::Manual signing with the certificate and profiles from secrets." ;;
            *) echo "::error::Manual signing needs all of IOS_DISTRIBUTION_CERT_P12_BASE64, IOS_DISTRIBUTION_CERT_PASSWORD and IOS_PROVISIONING_PROFILES_BASE64, or none of them."
               exit 1 ;;
          esac

      - name: Release tooling selftest
        run: node scripts/release/selftest.mjs

      - name: Bundle rules Apple enforces (icons, privacy manifests, ids, App Group)
        run: node scripts/release/check-release.mjs --version "${{ steps.version.outputs.version }}"

      - name: App Store Connect preflight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          VERSION: ${{ steps.version.outputs.version }}
          UPLOAD: ${{ steps.version.outputs.upload }}
        run: |
          ARGS=(--version "$VERSION")
          [ "$UPLOAD" = "true" ] && ARGS+=(--upload)
          node scripts/release/preflight.mjs "${ARGS[@]}"

      # Strictly higher than every build App Store Connect holds, including
      # ones uploaded from a Mac with scripts/release/testflight-local.sh.
      - name: Next build number
        id: build
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          NUMBER=$(node scripts/release/next-build-number.mjs)
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "::notice::Build number $NUMBER"

  package:
    name: PadelKit tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: swift test --package-path Packages/PadelKit

  archive:
    name: Archive and upload (macOS)
    needs: [preflight, package]
    # Xcode 26 / iOS 26 SDK: App Store Connect refuses builds from older SDKs.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD: ${{ needs.preflight.outputs.build }}
      TEAM_ID: ${{ needs.preflight.outputs.team }}
      SIGNING: ${{ needs.preflight.outputs.signing }}
      ARCHIVE_PATH: ${{ github.workspace }}/build/PadelOS.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Xcode and SDK
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK, watchOS SDK $(xcrun --sdk watchos --show-sdk-version)"
          [ "${SDK%%.*}" -ge 26 ] || { echo "::error::iOS SDK $SDK; App Store Connect requires 26 or later."; exit 1; }

      - name: Project matches project.yml
        run: |
          scripts/xcodegen.sh
          git diff --exit-code --stat -- PadelOS.xcodeproj ||
            { echo "::error::PadelOS.xcodeproj is out of date. Run scripts/xcodegen.sh and commit the result."; exit 1; }

      - name: Install the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # altool looks for AuthKey_<id>.p8 here; outside the workspace so no artifact can pick it up.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          if printf '%s' "$API_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s' "$API_KEY" | tr -d '\r' > "$KEY_PATH"
          else
            printf '%s' "$API_KEY" | tr -d '[:space:]' | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH" || { echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 is not a .p8 key."; exit 1; }
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Import certificate and profiles (manual signing)
        if: env.SIGNING == 'manual'
        env:
          CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROFILES_B64: ${{ secrets.IOS_PROVISIONING_PROFILES_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_B64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign waits for a keychain prompt nobody can click.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          # A .zip of profiles, or a single .mobileprovision.
          mkdir -p "$RUNNER_TEMP/profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILES_B64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/profiles.bin"
          if unzip -tq "$RUNNER_TEMP/profiles.bin" >/dev/null 2>&1; then
            unzip -q -j "$RUNNER_TEMP/profiles.bin" '*.mobileprovision' -d "$RUNNER_TEMP/profiles"
          else
            cp "$RUNNER_TEMP/profiles.bin" "$RUNNER_TEMP/profiles/profile.mobileprovision"
          fi

          # bundle id → profile name, read from the profiles themselves.
          MAP="$RUNNER_TEMP/profiles.plist"
          /usr/libexec/PlistBuddy -c 'Clear dict' "$MAP" >/dev/null 2>&1 || true
          for PROFILE in "$RUNNER_TEMP"/profiles/*.mobileprovision; do
            security cms -D -i "$PROFILE" > "$RUNNER_TEMP/p.plist"
            NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/p.plist")
            UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/p.plist")
            APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/p.plist")
            BUNDLE_ID="${APP_ID#*.}"
            cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
            /usr/libexec/PlistBuddy -c "Add :$BUNDLE_ID string $NAME" "$MAP"
            echo "Profile '$NAME' → $BUNDLE_ID"
          done
          missing=()
          for BUNDLE_ID in $(node scripts/release/lib/project.mjs bundle-ids); do
            /usr/libexec/PlistBuddy -c "Print :$BUNDLE_ID" "$MAP" >/dev/null 2>&1 || missing+=("$BUNDLE_ID")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::No App Store profile for: ${missing[*]}. IOS_PROVISIONING_PROFILES_BASE64 must hold one per bundle id (docs/RELEASE.md §4)."
            exit 1
          fi
          echo "PROFILE_MAP=$MAP" >> "$GITHUB_ENV"

      # Archived unsigned: signing here would make Xcode mint a development
      # certificate on every fresh runner, and the team's certificate cap is
      # shared with Wrexist's other apps (Airline-Empire run 38104614398).
      # The App Store signature is applied at export.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PadelOS.xcodeproj -scheme PadelOS -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E 'error:|warning:|ARCHIVE' || true
          grep -q 'ARCHIVE SUCCEEDED' "$RUNNER_TEMP/archive.log"

      # Gives every bundle its entitlements back (the watch app and complication
      # need the App Group), so export signs them with the right capabilities.
      - name: Ad-hoc sign the archived bundles with their entitlements
        run: scripts/release/adhoc-sign-archive.sh "$ARCHIVE_PATH" "$TEAM_ID"

      - name: Export the .ipa
        id: export
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Clear dict' "$OPTIONS" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy \
            -c 'Add :method string app-store-connect' \
            -c 'Add :destination string export' \
            -c "Add :teamID string $TEAM_ID" \
            -c "Add :signingStyle string $SIGNING" \
            -c 'Add :uploadSymbols bool true' \
            -c 'Add :manageAppVersionAndBuildNumber bool false' \
            "$OPTIONS"
          EXTRA=()
          if [ "$SIGNING" = "manual" ]; then
            /usr/libexec/PlistBuddy -c 'Add :signingCertificate string Apple Distribution' "$OPTIONS"
            /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' -c "Merge $PROFILE_MAP :provisioningProfiles" "$OPTIONS"
          else
            # Cloud-managed distribution certificate; creates or updates the four
            # App Store profiles (and registers missing identifiers) as needed.
            EXTRA=(-allowProvisioningUpdates
                   -authenticationKeyPath "$ASC_KEY_PATH"
                   -authenticationKeyID "$KEY_ID"
                   -authenticationKeyIssuerID "$ISSUER_ID")
          fi
          plutil -p "$OPTIONS"
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$OPTIONS" "${EXTRA[@]}" 2>&1 | tee "$RUNNER_TEMP/export.log"
          ls -la "$EXPORT_PATH"

      - name: Why signing failed
        if: failure()
        run: |
          LOGS=$(ls "$RUNNER_TEMP"/archive.log "$RUNNER_TEMP"/export.log 2>/dev/null || true)
          [ -n "$LOGS" ] || exit 0
          # shellcheck disable=SC2086
          if grep -qiE 'maximum number of certificates|choose a certificate to revoke' $LOGS; then
            echo "::error::The team already has the maximum number of Apple Distribution certificates. Switch to manual signing (docs/RELEASE.md §4) or revoke an unused certificate at developer.apple.com/account/resources/certificates."
          elif grep -qiE 'program membership|not eligible for this feature' $LOGS; then
            echo "::error::Apple refused provisioning for this team: check developer.apple.com/account for an expired membership or an agreement waiting to be accepted. Not a code problem."
          elif grep -qiE 'Cloud signing permission|not allowed to (use|perform).*(cloud|distribution)|(API key|team key).*(role|permission)' $LOGS; then
            echo "::error::Cloud-managed signing needs an API key with the Admin role. Create an Admin key, or use manual signing (docs/RELEASE.md §4)."
          elif grep -qiE 'No profiles for|App Group|requires a provisioning profile' $LOGS; then
            echo "::error::Provisioning failed for a bundle or the App Group group.app.padelos. Run scripts/release/testflight-local.sh once from a Mac (registers ids and the App Group), or see docs/RELEASE.md §2."
          fi
          exit 0

      - name: Inspect the exported app
        run: |
          set -euo pipefail
          IPA=$(ls "$EXPORT_PATH"/*.ipa)
          WORK="$RUNNER_TEMP/ipa"; rm -rf "$WORK"; mkdir -p "$WORK"; unzip -q "$IPA" -d "$WORK"
          APP="$WORK/Payload/PadelOS.app"
          WATCH="$APP/Watch/PadelOSWatch.app"
          fail() { echo "::error::$*"; exit 1; }
          for BUNDLE in "$APP" "$APP/PlugIns/PadelOSWidgets.appex" "$WATCH" "$WATCH/PlugIns/PadelOSWatchWidgets.appex"; do
            [ -d "$BUNDLE" ] || fail "Missing ${BUNDLE#"$WORK"/}"
            V=$(plutil -extract CFBundleShortVersionString raw "$BUNDLE/Info.plist")
            B=$(plutil -extract CFBundleVersion raw "$BUNDLE/Info.plist")
            if [ "$V" != "$VERSION" ] || [ "$B" != "$BUILD" ]; then
              fail "${BUNDLE#"$WORK"/} is $V ($B), expected $VERSION ($BUILD)"
            fi
            echo "✓ ${BUNDLE#"$WORK"/Payload/} $V ($B)"
          done
          for BUNDLE in "$APP" "$WATCH" "$WATCH/PlugIns/PadelOSWatchWidgets.appex"; do
            [ -f "$BUNDLE/PrivacyInfo.xcprivacy" ] || fail "No PrivacyInfo.xcprivacy in ${BUNDLE#"$WORK"/}"
          done
          echo "✓ Privacy manifests bundled"
          for BUNDLE in "$WATCH" "$WATCH/PlugIns/PadelOSWatchWidgets.appex"; do
            codesign -d --entitlements - --xml "$BUNDLE" 2>/dev/null | grep -q 'group.app.padelos' ||
              fail "${BUNDLE#"$WORK"/} is signed without the App Group group.app.padelos"
          done
          echo "✓ Watch app and complication signed with the App Group"
          codesign --verify --deep --strict "$APP" && echo "✓ Signature verifies"

      # Kept even when the upload fails: with the .ipa anyone can upload via Transporter.
      - name: Keep the .ipa
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: padelos-${{ env.VERSION }}-${{ env.BUILD }}-ipa
          path: ${{ env.EXPORT_PATH }}/*.ipa
          if-no-files-found: error
          retention-days: 14

      # dSYMs turn TestFlight crash reports into symbolicated stack traces.
      - name: Keep the dSYMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: padelos-${{ env.VERSION }}-${{ env.BUILD }}-dsyms
          path: ${{ env.ARCHIVE_PATH }}/dSYMs
          if-no-files-found: warn
          retention-days: 90

      # --upload-app validates server-side anyway; validating first would ask Apple twice.
      - name: Validate with Apple (archive-only runs)
        if: needs.preflight.outputs.upload != 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: xcrun altool --validate-app --type ios --file "$(ls "$EXPORT_PATH"/*.ipa)" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Upload to App Store Connect
        if: needs.preflight.outputs.upload == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: xcrun altool --upload-app --type ios --file "$(ls "$EXPORT_PATH"/*.ipa)" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Clean up credentials
        if: always()
        run: |
          rm -f "$HOME"/.appstoreconnect/private_keys/AuthKey_*.p8
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  processing:
    name: Wait for processing (ubuntu)
    needs: [preflight, archive]
    if: needs.preflight.outputs.upload == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Poll App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          node scripts/release/wait-for-processing.mjs \
            --version "${{ needs.preflight.outputs.version }}" \
            --build "${{ needs.preflight.outputs.build }}" --timeout 45
      - name: Summary
        run: |
          {
            echo "### PadelOS ${{ needs.preflight.outputs.version }} (${{ needs.preflight.outputs.build }}) is in TestFlight"
            echo "Internal testers can install it now. External groups need Beta App Review."
          } >> "$GITHUB_STEP_SUMMARY"
