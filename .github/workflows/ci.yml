name: CI

# Linux first, macOS second. `checks` and `package-linux` answer everything that
# needs no Xcode in about a minute; the macOS job only starts when `checks` is
# green, so an obviously broken commit never books a macOS runner.
#
# Runs on pull requests and on pushes to main (not on every branch push, which
# ran CI twice for every PR commit). Run it on any branch from the Actions tab.
# Markdown and docs-only changes skip CI entirely.

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A superseded PR run is wasted time; runs on main always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Release rules, translations, workflows (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Release tooling selftest
        run: node scripts/release/selftest.mjs

      # Icons, privacy manifests, bundle ids, App Group, export compliance: the
      # rules App Store Connect enforces at upload time, checked on every change.
      - name: App Store bundle rules
        run: node scripts/release/check-release.mjs

      - name: Translations and String Catalogs
        run: |
          mapfile -t LANGS < <(find Localization/translations -name '*.json' -exec basename {} .json \; | sort)
          python3 scripts/check_translation.py "${LANGS[@]}"
          python3 scripts/build_string_catalogs.py --check
          git diff --exit-code -- 'Apps/*/Localizable.xcstrings'

      - name: Lint workflows and shell scripts
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint -color
          shellcheck scripts/*.sh scripts/release/*.sh

  package-linux:
    name: PadelKit tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test shared package
        run: swift test --package-path Packages/PadelKit

  apple:
    name: iOS + watchOS build, package and UI tests (macOS)
    needs: checks
    # Same image as the TestFlight archive, so CI compiles with the SDK that ships.
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select newest Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphonesimulator|watchsimulator"

      # PadelOS.xcodeproj is committed so the project opens straight in Xcode;
      # this keeps it honest. The XcodeGen version is pinned in the script.
      - name: Project matches project.yml
        run: |
          scripts/xcodegen.sh
          git diff --exit-code --stat -- PadelOS.xcodeproj ||
            { echo "::error::PadelOS.xcodeproj is out of date. Run scripts/xcodegen.sh and commit the result."; exit 1; }

      - name: Test shared package (macOS)
        run: swift test --package-path Packages/PadelKit

      - name: Build watchOS app
        run: |
          set -o pipefail
          xcodebuild -project PadelOS.xcodeproj -scheme PadelOSWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee watch-build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" watch-build.log

      - name: Build iOS app (embeds the watch app)
        run: |
          set -o pipefail
          xcodebuild -project PadelOS.xcodeproj -scheme PadelOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee ios-build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" ios-build.log
          ls "build/Build/Products/Debug-iphonesimulator/PadelOS.app/Watch"

      - name: Export localizations (string extraction check)
        if: always()
        run: |
          mkdir -p localization
          xcodebuild -exportLocalizations -project PadelOS.xcodeproj \
            -localizationPath localization -exportLanguage en \
            CODE_SIGNING_ALLOWED=NO > export-localizations.log 2>&1 || { tail -40 export-localizations.log; true; }
          find localization -name "*.xliff" | head
          find localization -name "*.xliff" -exec grep -c "<trans-unit" {} + || true

      - name: Pick simulators
        id: sims
        run: |
          xcrun simctl list devices available -j > devices.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("devices.json"))["devices"]
          def pick(prefixes, runtime_key):
              # Exact device names first ("iPhone 17 Pro" must not pick "iPhone 17 Pro Max"),
              # then prefixes, newest runtime first.
              for match in (lambda n, p: n == p, lambda n, p: n.startswith(p)):
                  for prefix in prefixes:
                      for runtime in sorted(data, reverse=True):
                          if runtime_key not in runtime:
                              continue
                          for d in data[runtime]:
                              if match(d["name"], prefix) and d["isAvailable"]:
                                  return d["udid"], d["name"]
              return "", ""
          ios = pick(["iPhone 17 Pro", "iPhone 16 Pro", "iPhone 17", "iPhone 16", "iPhone"], "iOS")
          watch = pick(["Apple Watch Ultra", "Apple Watch Series", "Apple Watch"], "watchOS")
          print(f"ios={ios[0]}")
          print(f"ios_name={ios[1]}")
          print(f"watch={watch[0]}")
          print(f"watch_name={watch[1]}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: UI tests (iPhone)
        run: |
          set -o pipefail
          xcodebuild -project PadelOS.xcodeproj -scheme PadelOS \
            -destination "id=${{ steps.sims.outputs.ios }}" \
            -derivedDataPath build -resultBundlePath UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO test | tee ui-tests.log | grep -E "error:|Test Case|Executed|TEST" || true
          grep -q "TEST SUCCEEDED" ui-tests.log

      - name: Export UI test screenshots
        if: always()
        run: |
          mkdir -p screenshots/iphone
          xcrun xcresulttool export attachments --path UITests.xcresult --output-path screenshots/iphone || true
          find screenshots/iphone -maxdepth 1 | head -50

      - name: UI journey in dark mode (screenshots)
        run: |
          set -o pipefail
          UDID="${{ steps.sims.outputs.ios }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl ui "$UDID" appearance dark
          xcodebuild test-without-building -project PadelOS.xcodeproj -scheme PadelOS \
            -destination "id=$UDID" -derivedDataPath build -resultBundlePath UITestsDark.xcresult \
            -only-testing:PadelOSUITests/OrganiserJourneyUITests/testCreateScoreUndoFinishStandingsRelaunchResume \
            CODE_SIGNING_ALLOWED=NO | tee ui-tests-dark.log | grep -E "error:|Test Case|Executed|TEST" || true
          grep -qE "TEST (EXECUTE )?SUCCEEDED" ui-tests-dark.log
          mkdir -p screenshots/iphone-dark
          xcrun xcresulttool export attachments --path UITestsDark.xcresult --output-path screenshots/iphone-dark || true

      - name: Localized UI tests and screenshots (Spanish, Arabic right-to-left, Swedish)
        run: |
          UDID="${{ steps.sims.outputs.ios }}"
          xcrun simctl ui "$UDID" appearance light || true
          for pair in "es:es_ES" "ar:ar_SA" "sv:sv_SE"; do
            LANG_CODE="${pair%%:*}"; LOCALE="${pair##*:}"
            TEST_RUNNER_UITEST_LANGUAGE="$LANG_CODE" TEST_RUNNER_UITEST_LOCALE="$LOCALE" \
            xcodebuild test-without-building -project PadelOS.xcodeproj -scheme PadelOS \
              -destination "id=$UDID" -derivedDataPath build -resultBundlePath "UITests-$LANG_CODE.xcresult" \
              -only-testing:PadelOSUITests/OrganiserJourneyUITests/testOnboardingPagesAndGetStarted \
              -only-testing:PadelOSUITests/OrganiserJourneyUITests/testPlayoffBracketIsShown \
              CODE_SIGNING_ALLOWED=NO > "ui-tests-$LANG_CODE.log" 2>&1 || true
            grep -E "Test Case .* (passed|failed)|TEST (EXECUTE )?(SUCCEEDED|FAILED)" "ui-tests-$LANG_CODE.log" || true
            mkdir -p "screenshots/iphone-$LANG_CODE"
            xcrun xcresulttool export attachments --path "UITests-$LANG_CODE.xcresult" --output-path "screenshots/iphone-$LANG_CODE" || true
          done
          for LANG_CODE in es ar sv; do
            grep -qE "TEST (EXECUTE )?SUCCEEDED" "ui-tests-$LANG_CODE.log" || { echo "UI tests failed in $LANG_CODE"; exit 1; }
          done

      - name: Watch screenshot (Apple Watch demo scoring screen)
        if: always()
        run: |
          set -x
          UDID="${{ steps.sims.outputs.watch }}"
          [ -n "$UDID" ] || exit 0
          mkdir -p screenshots/watch
          WATCH_BUILD=$(mktemp -d)
          xcodebuild -project PadelOS.xcodeproj -scheme PadelOSWatch \
            -destination "id=$UDID" -derivedDataPath "$WATCH_BUILD" CODE_SIGNING_ALLOWED=NO build > watch-sim-build.log 2>&1 || { tail -50 watch-sim-build.log; exit 0; }
          APP=$(find "$WATCH_BUILD/Build/Products" -name "PadelOSWatch.app" -maxdepth 2 | head -1)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" app.padelos.PadelOS.watchkitapp -demo-scoring
          sleep 12
          xcrun simctl io "$UDID" screenshot screenshots/watch/watch-scoring.png
          xcrun simctl terminate "$UDID" app.padelos.PadelOS.watchkitapp || true
          xcrun simctl launch "$UDID" app.padelos.PadelOS.watchkitapp
          sleep 8
          xcrun simctl io "$UDID" screenshot screenshots/watch/watch-home.png
          echo "${{ steps.sims.outputs.watch_name }}" > screenshots/watch/device.txt

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-and-logs
          path: |
            screenshots
            localization
            *.log
          if-no-files-found: warn
          retention-days: 7
